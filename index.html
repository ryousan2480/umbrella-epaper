<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>今日の傘マップ</title>
<style>
  html, body { margin:0; padding:0; background:#000; height:100%; overflow:hidden; }
  body { display:flex; align-items:center; justify-content:center; font-family:"Noto Sans CJK JP", sans-serif; }
  #map { max-width:100vw; max-height:100vh; object-fit:contain; display:block; transition:opacity .8s ease, filter .8s ease; }
  #map.fading { opacity:0; }
  body.night #map { filter:brightness(.55); }
  /* Liquid Glass chip */
  #chip {
    position:fixed; top:14px; left:14px; z-index:10;
    display:flex; align-items:center; gap:8px;
    padding:8px 14px; border-radius:999px;
    color:#fff; font-size:14px; letter-spacing:.02em;
    background:linear-gradient(135deg, rgba(255,255,255,.34), rgba(255,255,255,.12));
    -webkit-backdrop-filter:blur(14px) saturate(160%);
    backdrop-filter:blur(14px) saturate(160%);
    border:1px solid rgba(255,255,255,.45);
    box-shadow:0 4px 18px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.5);
    text-shadow:0 1px 2px rgba(0,0,0,.35);
  }
  #chip .dot { width:8px; height:8px; border-radius:50%; background:#69f0ae; box-shadow:0 0 6px #69f0ae; }
</style>
</head>
<body>
<img id="map" src="latest.png" alt="今日の傘マップ">
<div id="chip"><span class="dot"></span><span id="chipText">今日の傘マップ</span></div>
<script>
  var img = document.getElementById('map');
  var chipText = document.getElementById('chipText');

  function tickClock() {
    var now = new Date();
    var wd = ['日','月','火','水','木','金','土'][now.getDay()];
    var hh = ('0' + now.getHours()).slice(-2);
    var mm = ('0' + now.getMinutes()).slice(-2);
    chipText.textContent = (now.getMonth() + 1) + '月' + now.getDate() + '日(' + wd + ') ' + hh + ':' + mm + ' ・ 自動更新中';
    var h = now.getHours();
    document.body.classList.toggle('night', h >= 22 || h < 5);
  }
  tickClock();
  setInterval(tickClock, 30 * 1000);

  // Swap the image with a gentle fade only when a new map is published.
  var lastTag = null;
  function checkUpdate() {
    fetch('latest.png', { method: 'HEAD', cache: 'no-store' })
      .then(function (res) {
        var tag = res.headers.get('ETag') || res.headers.get('Last-Modified');
        if (tag && lastTag && tag !== lastTag) {
          img.classList.add('fading');
          setTimeout(function () {
            img.src = 'latest.png?t=' + Date.now();
            img.classList.remove('fading');
          }, 400);
        }
        if (tag) { lastTag = tag; }
      })
      .catch(function () { /* offline: keep showing the current map */ });
  }
  checkUpdate();
  setInterval(checkUpdate, 10 * 60 * 1000);

  // Full page reload once a day as a safety net.
  setInterval(function () { location.reload(); }, 24 * 60 * 60 * 1000);
</script>
</body>
</html>
